<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaveAI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
body{background:#070a14;color:#fff;height:100vh;display:flex;flex-direction:column}
header{padding:18px;text-align:center;border-bottom:1px solid #1a1f35;background:#0a0f22}
header h1{font-size:22px;font-weight:800}header h1 span{color:#5b8def}
header p{font-size:12px;color:#8a94b5;margin-top:4px}
#setup{padding:12px 20px;background:#141a2e;display:flex;gap:8px;border-bottom:1px solid #1e2744}
#setup input{flex:1;padding:10px 14px;border-radius:20px;border:1px solid #233055;background:#0a0f22;color:#fff;outline:none;font-size:13px}
#setup button{padding:10px 16px;border-radius:20px;border:none;background:#5b8def;color:#fff;font-size:12px;font-weight:bold;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:82%;padding:12px 16px;border-radius:18px;line-height:1.5;font-size:15px;white-space:pre-wrap}
.user{background:linear-gradient(135deg,#5b8def,#7a5CFA);align-self:flex-end;border-bottom-right-radius:5px}
.ai{background:#141a2e;align-self:flex-start;border-bottom-left-radius:5px;border:1px solid #1e2744}
#inputArea{padding:14px;display:flex;gap:10px;border-top:1px solid #1a1f35;background:#0a0f22}
#userInput{flex:1;padding:14px 18px;border-radius:25px;border:1px solid #233055;background:#141a2e;color:#fff;outline:none}
button#sendBtn{padding:14px 22px;border-radius:25px;border:none;background:linear-gradient(135deg,#5b8def,#7a5CFA);color:#fff;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<header><h1>Wave<span>AI</span> 🌊</h1><p>Powered by Gemini</p></header>

<div id="setup">
<input id="apiKeyInput" type="password" placeholder="Paste your Gemini API key here (AIza...)">
<button onclick="saveKey()">Save Key</button>
</div>

<div id="chat"><div class="msg ai">Welcome to WaveAI 🌊! Paste your Gemini key on top, save am, then start chatting.</div></div>

<div id="inputArea">
<input id="userInput" placeholder="Ask WaveAI anything...">
<button id="sendBtn">Send</button>
</div>

<script>
let API_KEY = localStorage.getItem('waveai_key') || '';
if(API_KEY) document.getElementById('apiKeyInput').value = API_KEY;

function saveKey(){
  const k = document.getElementById('apiKeyInput').value.trim();
  if(!k){ alert('Paste your key'); return; }
  localStorage.setItem('waveai_key', k);
  API_KEY = k;
  alert('WaveAI key saved! Now you can chat.');
  add('Key saved ✅ Ready to chat!', 'ai');
}

const chatDiv = document.getElementById('chat');
const input = document.getElementById('userInput');
const btn = document.getElementById('sendBtn');

async function send(){
  const text = input.value.trim();
  if(!text) return;
  if(!API_KEY){ alert('Paste your Gemini API key for top first'); return; }
  add(text,'user');
  input.value='';
  btn.disabled=true; btn.textContent='...';
  try{
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`;
    const res = await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:text}]}]})
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error.message);
    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No reply';
    add(reply,'ai');
  }catch(e){ add('Error: '+e.message,'ai'); }
  btn.disabled=false; btn.textContent='Send';
}

function add(t,c){
  const d=document.createElement('div');
  d.className=`msg ${c}`; d.textContent=t;
  chatDiv.appendChild(d); chatDiv.scrollTop=chatDiv.scrollHeight;
}
btn.onclick=send;
input.addEventListener('keydown',e=>{if(e.key==='Enter') send();});
</script>
</body>
</html>
