<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaveAI - The Future of Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
body{background:#060913;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{height:64px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.06);background:rgba(10,15,34,0.8);backdrop-filter:blur(20px);position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.logo svg{filter:drop-shadow(0 0 10px #5b8def)}
.actions{display:flex;gap:8px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.05);display:grid;place-items:center;cursor:pointer;transition:.2s}
.icon-btn:hover{background:rgba(255,255,255,0.1)}

#setup{margin:12px 16px;padding:12px;background:linear-gradient(135deg,rgba(91,141,239,0.15),rgba(122,92,250,0.15));border:1px solid rgba(91,141,239,0.2);border-radius:16px;display:flex;gap:10px;align-items:center}
#setup svg{flex-shrink:0}
#setup input{flex:1;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);padding:10px 14px;border-radius:12px;color:#fff;outline:none;font-size:13px}
#setup button{background:#fff;color:#000;padding:10px 16px;border-radius:12px;border:none;font-weight:700;font-size:12px;cursor:pointer}

#chat{flex:1;overflow-y:auto;padding:24px 16px;display:flex;flex-direction:column;gap:20px;background:radial-gradient(800px at 50% -100px, rgba(91,141,239,0.15), transparent), #060913;}
.row{display:flex;gap:12px;max-width:760px;width:100%;margin:0 auto;animation:up .3s ease}
.row.user{flex-direction:row-reverse}
.avatar{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.avatar.ai{background:linear-gradient(135deg,#5b8def,#7a5CFA)}
.avatar.user{background:#fff;color:#000}
.bubble{padding:14px 18px;border-radius:18px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;max-width:85%;position:relative}
.bubble.ai{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-bottom-left-radius:6px}
.bubble.user{background:linear-gradient(135deg,#5b8def,#7a5CFA);border-bottom-right-radius:6px;box-shadow:0 8px 20px rgba(91,141,239,0.25)}
.bubble .copy{position:absolute;bottom:-22px;right:0;font-size:11px;opacity:0;cursor:pointer;color:#8a94b5;transition:.2s}
.row:hover .copy{opacity:1}

#inputArea{padding:16px;background:rgba(10,15,34,0.9);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.06);display:flex;justify-content:center}
.input-wrap{max-width:760px;width:100%;display:flex;align-items:center;gap:10px;background:#12182e;border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:6px 8px 6px 18px;transition:.2s}
.input-wrap:focus-within{border-color:#5b8def;box-shadow:0 0 0 4px rgba(91,141,239,0.15)}
#userInput{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:15px;padding:10px 0}
.send{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#5b8def,#7a5CFA);border:none;display:grid;place-items:center;cursor:pointer;transition:.2s}
.send:disabled{opacity:.5}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.typing{display:flex;gap:4px;padding:14px 18px;background:rgba(255,255,255,0.06);border-radius:18px;width:fit-content}
.typing span{width:6px;height:6px;background:#5b8def;border-radius:50%;animation:b 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes b{0%,80%,100%{transform:scale(0.8);opacity:.5}40%{transform:scale(1);opacity:1}}
</style>
</head>
<body>

<header>
<div class="logo">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M2 12C2 12 5 6 12 6C19 6 22 12 22 12C22 12 19 18 12 18C5 18 2 12 2 12Z" stroke="#5b8def" stroke-width="1.5"/><path d="M3 12C3 12 6.5 9 12 9C17.5 9 21 12 21 12C21 12 17.5 15 12 15C6.5 15 3 12 3 12Z" stroke="#7a5CFA" stroke-width="1.2"/><circle cx="12" cy="12" r="2" fill="#fff"/></svg>
WaveAI
</div>
<div class="actions">
<button class="icon-btn" onclick="clearChat()" title="Clear chat">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4h8v2M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
</button>
<button class="icon-btn" onclick="window.open('https://aistudio.google.com/app/apikey','_blank')" title="Get API Key">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2L13.5 8.5H20L14.75 12.5L16.25 19L12 14.75L7.75 19L9.25 12.5L4 8.5H10.5L12 2Z"/></svg>
</button>
</div>
</header>

<div id="setup">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5b8def" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
<input id="apiKeyInput" type="password" placeholder="Paste Gemini API Key (AIza...)">
<button onclick="saveKey()">Save</button>
</div>

<div id="chat"></div>

<div id="inputArea">
<div class="input-wrap">
<input id="userInput" placeholder="Ask WaveAI anything...">
<button class="send" id="sendBtn">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
</button>
</div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('userInput');
const btn = document.getElementById('sendBtn');
let API_KEY = localStorage.getItem('waveai_key') || '';
if(API_KEY) document.getElementById('apiKeyInput').value = API_KEY;

function saveKey(){
  const k=document.getElementById('apiKeyInput').value.trim();
  if(!k) return alert('Paste your Gemini key first');
  localStorage.setItem('waveai_key',k); API_KEY=k;
  document.getElementById('setup').style.display='none';
  addMsg('Key saved! 🌊 WaveAI is ready. What are we building today?','ai');
}
if(API_KEY) document.getElementById('setup').style.display='none';

function addMsg(text, who){
  const row=document.createElement('div'); row.className=`row ${who}`;
  const av=document.createElement('div'); av.className=`avatar ${who}`;
  av.innerHTML = who==='ai' ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M2 12C2 12 5 6 12 6C19 6 22 12 22 12C22 12 19 18 12 18C5 18 2 12 2 12Z" stroke="white" stroke-width="1.5"/></svg>` : `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2"><path d="M20 21a8 8 0 1 0-16 0"/><circle cx="12" cy="8" r="5"/></svg>`;
  const bub=document.createElement('div'); bub.className=`bubble ${who}`;
  bub.textContent=text;
  if(who==='ai'){
    const c=document.createElement('span'); c.className='copy'; c.textContent='copy';
    c.onclick=()=>{navigator.clipboard.writeText(text); c.textContent='copied!'; setTimeout(()=>c.textContent='copy',1000)}
    bub.appendChild(c);
  }
  row.appendChild(av); row.appendChild(bub);
  chat.appendChild(row); chat.scrollTop=chat.scrollHeight;
}

function showTyping(){
  const d=document.createElement('div'); d.id='typing'; d.className='row';
  d.innerHTML=`<div class="avatar ai"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M2 12C2 12 5 6 12 6C19 6 22 12 22 12C22 12 19 18 12 18C5 18 2 12 2 12Z" stroke="white" stroke-width="1.5"/></svg></div><div class="typing"><span></span><span></span><span></span></div>`;
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
}
function hideTyping(){ const t=document.getElementById('typing'); if(t) t.remove(); }

async function send(){
  const text=input.value.trim(); if(!text) return;
  if(!API_KEY){ alert('Add your Gemini API key for top first!'); return; }
  addMsg(text,'user'); input.value=''; btn.disabled=true; showTyping();
  try{
    const url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:text}]}]})});
    const data=await res.json();
    if(data.error) throw new Error(data.error.message);
    const reply=data.candidates?.[0]?.content?.parts?.[0]?.text || 'No reply';
    hideTyping(); addMsg(reply,'ai');
  }catch(e){ hideTyping(); addMsg('Error: '+e.message+' - Check your API key or try again.','ai'); }
  btn.disabled=false;
}
function clearChat(){ chat.innerHTML=''; addMsg('New chat started 🌊 How can WaveAI help?','ai'); }

btn.onclick=send;
input.addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
addMsg('Welcome to WaveAI 🌊 Your intelligent AI assistant powered by Gemini. Ask me anything!', 'ai');
</script>
</body>
</html>
