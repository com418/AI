<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaveAI Super</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
body{background:#060913;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{height:64px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.06);background:rgba(10,15,34,0.8)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
#chat{flex:1;overflow-y:auto;padding:24px 16px;display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:12px;max-width:780px;width:100%;margin:0 auto}
.row.user{flex-direction:row-reverse}
.avatar{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(135deg,#5b8def,#7a5CFA)}
.avatar.user{background:#fff;color:#000}
.bubble{padding:14px 18px;border-radius:18px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;max-width:85%}
.bubble.ai{background:rgba(255,255,255,0.06);border-bottom-left-radius:6px}
.bubble.user{background:linear-gradient(135deg,#5b8def,#7a5CFA);border-bottom-right-radius:6px}
#inputArea{padding:16px;background:#0a0f22;border-top:1px solid rgba(255,255,255,0.06);display:flex;justify-content:center}
.input-wrap{max-width:780px;width:100%;display:flex;gap:10px;background:#12182e;border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:6px 8px 6px 18px}
#userInput{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:15px;padding:10px 0}
.send{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#5b8def,#7a5CFA);border:none;color:#fff;cursor:pointer}
</style>
</head>
<body>
<header><div class="logo">WaveAI Super</div><button onclick="location.reload()" style="padding:8px 12px;border-radius:10px;background:rgba(255,255,255,0.1);border:none;color:#fff">New</button></header>
<div id="chat"></div>
<div id="inputArea"><div class="input-wrap"><input id="userInput" placeholder="Ask anything..."><button class="send" id="sendBtn">↑</button></div></div>
<script>
// STEP 1: PUT YOUR NEW API KEY HERE - INSIDE THE QUOTES
const GEMINI_API_KEY = "AQ.Ab8RN6I-UcZ0Bs1iSRsz57lCW3tqP2VxS9C7nypXhmBp1TpzCg";

const chat=document.getElementById('chat');
const input=document.getElementById('userInput');
const btn=document.getElementById('sendBtn');
let history=[];
function addMsg(t,w){const r=document.createElement('div');r.className=`row ${w}`;r.innerHTML=`<div class="avatar ${w}">${w==='ai'?'W':'U'}</div><div class="bubble ${w}">${t}</div>`;chat.appendChild(r);chat.scrollTop=chat.scrollHeight}
async function send(){
 const text=input.value.trim(); if(!text) return;
 if(GEMINI_API_KEY.includes("PASTE")){alert("Put your API key at line 35!");return;}
 addMsg(text,'user'); history.push({role:"user",parts:[{text}]}); input.value=''; btn.disabled=true;
 try{
  const res=await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`,{
   method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({contents:history,generationConfig:{temperature:0.9,maxOutputTokens:8192}})
  });
  const data=await res.json(); if(data.error) throw new Error(data.error.message);
  const reply=data.candidates[0].content.parts[0].text;
  addMsg(reply,'ai'); history.push({role:"model",parts:[{text:reply}]});
 }catch(e){addMsg("Error: "+e.message,'ai')}
 btn.disabled=false;
}
btn.onclick=send; input.onkeydown=e=>{if(e.key==='Enter')send()};
addMsg("Welcome! Put your API key and start chatting.",'ai');
</script>
</body>
</html>
