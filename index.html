<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI - Gemini</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: -apple-system,sans-serif;}
body{background:#0a0a0a;color:white;height:100vh;display:flex;flex-direction:column;}
header{padding:18px;text-align:center;border-bottom:1px solid #222;}
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;}
.msg{max-width:80%;padding:12px 16px;border-radius:18px;line-height:1.5;font-size:15px;white-space:pre-wrap;}
.user{background:#fff;color:#000;align-self:flex-end;border-bottom-right-radius:4px;}
.ai{background:#1e1e1e;align-self:flex-start;border-bottom-left-radius:4px;border:1px solid #333;}
#inputArea{padding:14px;display:flex;gap:10px;border-top:1px solid #222;}
input{flex:1;padding:14px 18px;border-radius:25px;border:1px solid #333;background:#1a1a1a;color:white;outline:none;}
button{padding:14px 22px;border-radius:25px;border:none;background:white;color:black;font-weight:bold;cursor:pointer;}
</style>
</head>
<body>
<header><h1 style="font-size:18px;">My AI - Powered by Gemini ✨</h1></header>
<div id="chat"><div class="msg ai">Hello! I'm Gemini. Ask me anything.</div></div>
<div id="inputArea">
<input id="userInput" placeholder="Type message..." autocomplete="off">
<button id="sendBtn">Send</button>
</div>

<script>
// ====== GEMINI API ======
const API_KEY = "AQ.Ab8RN6K0MJaFDQ3ZhyohIW-qgayC9XRJr2GyO-09Lps2olsHmQ";
const MODEL = "gemini-2.0-flash"; // fast and free. You fit use gemini-2.0-flash or gemini-1.5-pro
// ========================

const chat = document.getElementById('chat');
const input = document.getElementById('userInput');
const btn = document.getElementById('sendBtn');

async function send(){
  const text = input.value.trim();
  if(!text) return;
  if(API_KEY.includes("PUT_YOUR")){
    alert("Put your Gemini API key first! Get from aistudio.google.com/app/apikey");
    return;
  }
  add(text, 'user');
  input.value='';
  btn.disabled=true;

  try{
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`;
    const res = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        contents: [{ parts: [{ text: text }] }]
      })
    });
    const data = await res.json();
    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || JSON.stringify(data, null, 2);
    add(reply, 'ai');
  }catch(e){
    add("Error: "+ e.message, 'ai');
  }
  btn.disabled=false;
}

function add(t, c){
  const d = document.createElement('div');
  d.className = `msg ${c}`;
  d.textContent = t;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

btn.onclick = send;
input.addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
</script>
</body>
</html>
